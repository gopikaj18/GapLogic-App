name: updated test suite - load

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: railway
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node.js Dependencies
        run: npm install || true
        continue-on-error: true

      - name: Create .env.local file
        run: |
          echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/railway" > .env.local
          echo "SESSION_SECRET=gaplogic-dev-secret-change-in-production-8f3k2m9x" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=mock-key" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=gaplogic-20118.firebaseapp.com" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=gaplogic-20118" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=gaplogic-20118.firebasestorage.app" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=756684809357" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=1:756684809357:web:49bd076e45fa4c22fe6ec4" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_DATABASE_URL=https://gaplogic-20118-default-rtdb.asia-southeast1.firebasedatabase.app" >> .env.local
          echo "OLLAMA_MODEL=llama3.2" >> .env.local
        continue-on-error: true

      - name: Run Database Migrations
        run: npm run db:migrate || true
        continue-on-error: true

      - name: Start Next.js App
        run: npm run dev &
        continue-on-error: true

      - name: Wait for Next.js app to be ready
        run: npx wait-on -t 60000 http://localhost:9002 || true
        continue-on-error: true

      - name: Install Python Dependencies
        run: |
          (python -m pip install --upgrade pip && pip install -r tests/load_tests/requirements.txt) || true
        continue-on-error: true

      - name: Run Baseline Load Test Suite
        run: |
          (cd tests/load_tests && python run_load_tests.py) || true
        continue-on-error: true

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-suite-report
          path: tests/load_tests/reports/test_report_latest.xlsx
