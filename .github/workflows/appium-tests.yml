name: Appium E2E Mobile QA Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/appium-tests/requirements.txt
        continue-on-error: true

      - name: Run Appium E2E Mobile Test Suite (Mock Mode)
        run: |
          cd tests/appium-tests
          python run_tests.py
        continue-on-error: true

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-suite-report
          path: tests/appium-tests/reports/test_report_latest.xlsx
